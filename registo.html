<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkTrace – Registo / Waitlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08080f; --bg2: #0d0d18; --card: #0f0f1e; --card2: #141428;
      --border: rgba(75,57,239,0.15); --purple: #4b39ef; --purple-bright: #6b5fff;
      --purple-glow: rgba(75,57,239,0.35); --purple-soft: rgba(75,57,239,0.12);
      --white: #f5f4ff; --muted: #7b78a8; --text: #cccbee;
      --radius: 14px; --font: 'Sora', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font); -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 68px;
      background: rgba(8,8,15,0.95); border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 1.1rem; font-weight: 700; color: var(--white); text-decoration: none;
    }
    .logo-icon {
      width: 32px; height: 32px; border-radius: 8px; background: var(--purple);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px var(--purple-glow);
    }
    .logo-icon svg { width: 16px; height: 16px; }
    .brand-trace { color: var(--purple-bright); text-shadow: 0 0 10px rgba(107,95,255,0.7); }
    .nav-back {
      color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 500;
      display: flex; align-items: center; gap: 6px; transition: color .2s;
    }
    .nav-back:hover { color: var(--white); }
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 60px 24px; position: relative; overflow: hidden;
    }
    main::before {
      content: ''; position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(75,57,239,0.08) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 44px; width: 100%; max-width: 480px;
      box-shadow: 0 0 60px rgba(75,57,239,0.08); position: relative;
    }
    .plan-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--purple-soft); border: 1px solid rgba(107,95,255,0.3);
      border-radius: 100px; padding: 5px 12px;
      font-size: 0.75rem; font-weight: 700; color: var(--purple-bright);
      text-transform: uppercase; letter-spacing: .06em;
      text-shadow: 0 0 8px rgba(107,95,255,0.5); margin-bottom: 24px;
    }
    h1 { font-size: 1.8rem; font-weight: 800; color: var(--white); line-height: 1.2; margin-bottom: 8px; }
    .subtitle { font-size: 0.92rem; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 7px; }
    input, select {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
      color: var(--white); font-family: var(--font); font-size: 0.9rem;
      transition: border-color .2s, box-shadow .2s; outline: none;
    }
    input::placeholder { color: var(--muted); }
    input:focus, select:focus {
      border-color: var(--purple-bright);
      box-shadow: 0 0 0 3px rgba(107,95,255,0.15);
    }
    select option { background: var(--card2); }
    .btn-submit {
      width: 100%; padding: 14px; border-radius: 11px;
      background: var(--purple); color: #fff; border: none;
      font-family: var(--font); font-size: 1rem; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      box-shadow: 0 0 20px var(--purple-glow);
      transition: background .2s, box-shadow .2s, transform .15s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--purple-bright);
      box-shadow: 0 0 32px rgba(107,95,255,0.6);
      transform: translateY(-1px);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 12px 14px;
      color: #f87171; font-size: 0.85rem; margin-top: 14px; display: none;
    }
    .terms {
      font-size: 0.78rem; color: var(--muted); text-align: center;
      margin-top: 16px; line-height: 1.6;
    }
    .terms a { color: var(--purple-bright); text-decoration: none; }
    .terms a:hover { text-decoration: underline; }
    .divider { height: 1px; background: var(--border); margin: 24px 0; }
    .back-link { text-align: center; font-size: 0.85rem; color: var(--muted); }
    .back-link a { color: var(--purple-bright); text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
    @media (max-width: 520px) {
      nav { padding: 0 20px; }
      .card { padding: 32px 22px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </svg>
    </div>
    <span>Work<span class="brand-trace">Trace</span></span>
  </a>
  <a href="index.html" class="nav-back">← Voltar ao início</a>
</nav>

<main>
  <div class="card">
    <div class="plan-badge" id="planBadge">⚡ Waitlist</div>
    <h1>Entra na lista de espera</h1>
    <p class="subtitle">Regista-te agora e sê dos primeiros a ter acesso ao WorkTrace quando lançarmos.</p>

    <form id="waitlistForm" onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label for="name">Nome completo</label>
        <input type="text" id="name" placeholder="O teu nome" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="o.teu@email.com" required />
      </div>
      <div class="form-group">
        <label for="empresa">Empresa (opcional)</label>
        <input type="text" id="empresa" placeholder="Nome da empresa" />
      </div>
      <div class="form-group">
        <label for="plano">Plano de interesse</label>
        <select id="plano">
          <option value="inicial">Inicial – Grátis</option>
          <option value="profissional">Profissional – 9,99€/mês</option>
          <option value="empresarial">Empresarial – 19,99€/mês</option>
        </select>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Entrar na Waitlist →</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="error-msg" id="errorMsg"></div>
    </form>

    <p class="terms">
      Ao registares-te, aceitas os nossos
      <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a>.
    </p>

    <div class="divider"></div>

    <p class="back-link">
      Tens dúvidas? <a href="contacto.html">Fala com a nossa equipa</a>
    </p>
  </div>
</main>

<script>
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  const SUPABASE_URL = 'https://lclllvpdnfwtnxqxrbnj.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_8w_m-1RjRiHNHBzikYpglQ_g6agnrHW';
  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  // Lê o plano da URL (?plano=profissional) e pré-seleciona
  const params = new URLSearchParams(window.location.search);
  const planoParam = params.get('plano');
  if (planoParam) {
    const select = document.getElementById('plano');
    const badge = document.getElementById('planBadge');
    const labels = {
      inicial: 'Plano Inicial',
      profissional: 'Plano Profissional',
      empresarial: 'Plano Empresarial'
    };
    if (select) select.value = planoParam;
    if (badge && labels[planoParam]) badge.textContent = '⚡ ' + labels[planoParam];
  }

  async function handleSubmit(e) {
    e.preventDefault();

    const btn      = document.getElementById('submitBtn');
    const btnText  = document.getElementById('btnText');
    const spinner  = document.getElementById('spinner');
    const errorMsg = document.getElementById('errorMsg');

    // Estado de loading
    btn.disabled = true;
    btnText.textContent = 'A enviar...';
    spinner.style.display = 'block';
    errorMsg.style.display = 'none';

    // Dados — nomes das colunas da tua tabela waitlist_signups
    const payload = {
      name:     document.getElementById('name').value.trim(),
      email:    document.getElementById('email').value.trim(),
      empresa:  document.getElementById('empresa').value.trim(),
      plano:    document.getElementById('plano').value,
      language: navigator.language?.slice(0, 2) || 'pt',
      source:   'site',
      status:   'new',
    };

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/waitlist_signups`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        window.location.href = 'obrigado.html';
      } else {
        const err = await res.json();
        throw new Error(err.message || 'Erro desconhecido');
      }
    } catch (err) {
      errorMsg.textContent = '❌ Erro: ' + err.message;
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btnText.textContent = 'Entrar na Waitlist →';
      spinner.style.display = 'none';
    }
  }
</script>

</body>
</html>
